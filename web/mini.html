<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meld</title>
<link rel="icon" type="image/png" sizes="256x256" href="/icons/meld-256.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/meld-32.png">
<meta name="theme-color" content="#e3a417">
<style>
  /* Deliberately self-contained: no shared stylesheet, no fonts to fetch, no framework. This
     page is opened as a chrome-less window that must paint instantly and keep working when the
     network is gone, which it always is - everything here is local.

     The palette is lifted from index.html so the preview reads as the same product rather than
     as a debug panel that happens to be next to it: the same warm stone-black, the same gold. */
  :root {
    --bg: #0b0a08; --panel: #16130d; --line: rgba(255,255,255,.10);
    --fg: #f0e9da; --dim: #9a9079; --accent: #e3a417; --accent2: #f0bf3a;
    --ok: #86b45a; --warn: #cf9f3c; --bad: #cf5a3e;
    --glass: rgba(28,26,21,.72); --hair: rgba(255,255,255,.09);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; padding: 10px; gap: 8px;
    -webkit-user-select: none; user-select: none;
  }
  header { display: flex; align-items: center; gap: 8px; padding: 2px 2px 0; }
  header .mark { width: 18px; height: 18px; flex: none; }
  h1 { font-size: 14px; margin: 0; letter-spacing: .16em; font-weight: 700; text-transform: uppercase;
       background: linear-gradient(180deg, var(--accent2), var(--accent));
       -webkit-background-clip: text; background-clip: text; color: transparent; }
  /* min-width:0 is load-bearing, not tidiness: a flex item defaults to min-width:auto, so this
     refuses to shrink below its text and pushes the whole 430px window wider than itself -
     every card then runs off the right edge. */
  .tag { font-size: 11px; color: var(--dim); flex: 1; min-width: 0; text-align: right;
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card { background: var(--glass); border: 1px solid var(--hair); border-radius: 12px; padding: 10px;
          box-shadow: 0 0 0 1px rgba(0,0,0,.4); min-width: 0; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
         min-width: 0; }
  .row > * { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .big { font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent2); }
  .dim { color: var(--dim); }
  .bar { height: 7px; background: rgba(0,0,0,.45); border-radius: 99px; overflow: hidden; margin-top: 7px;
         box-shadow: inset 0 0 0 1px var(--hair); }
  .bar > i { display: block; height: 100%; width: 0; transition: width .4s ease;
             background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .bar.failed > i { background: linear-gradient(90deg, var(--warn), var(--bad)); }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { text-align: center; }
  .stat b { display: block; font-size: 14px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }

  /* tabs */
  nav { display: flex; gap: 4px; }
  nav button { flex: 1; padding: 5px 4px; font-size: 11px; border-radius: 8px 8px 0 0;
               border: 1px solid var(--hair); border-bottom: none; background: rgba(0,0,0,.35);
               color: var(--dim); cursor: pointer; font-family: inherit; letter-spacing: .04em; }
  nav button:hover { color: var(--fg); }
  nav button[aria-selected="true"] { background: var(--glass); color: var(--accent2);
                                     box-shadow: inset 0 2px 0 var(--accent); }
  .pane { display: none; flex: 1; min-height: 0; min-width: 0; flex-direction: column; gap: 8px; }
  .pane.on { display: flex; }

  .console { flex: 1; min-height: 80px; min-width: 0; overflow: auto; background: rgba(0,0,0,.5);
             border: 1px solid var(--hair); border-radius: 0 10px 10px 10px; padding: 8px;
             font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 10.5px;
             line-height: 1.4; color: #cdc4ae; white-space: pre-wrap; word-break: break-word;
             -webkit-user-select: text; user-select: text; }
  .console div { padding: 0; }
  .console .sys { color: var(--dim); font-style: italic; }
  .console .err { color: var(--bad); }
  .console .warn { color: var(--warn); }
  .card.activity { flex: 1; min-height: 0; min-width: 0; display: flex; padding: 8px; }
  /* min-width:0 again, and it matters more here: a scrolling box of nowrap log lines is a flex
     item whose automatic minimum is the width of its LONGEST LINE. Without this the box refuses
     to be narrower than the text, the body stretches to match, and every card in the window is
     cut off at the right edge. overflow:auto cannot save it - the element never gets small. */
  .recent { flex: 1; min-width: 0; overflow: auto;
            font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
            font-size: 10px; line-height: 1.5; color: var(--dim); }
  .recent div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent div:last-child { color: var(--fg); }
  .consbar { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--dim); }
  .consbar label { display: flex; align-items: center; gap: 4px; cursor: pointer; }

  footer { display: flex; gap: 6px; }
  button.act { flex: 1; padding: 8px 4px; border-radius: 8px; border: 1px solid var(--hair);
               background: rgba(255,255,255,.05); color: var(--fg); font: inherit; font-size: 12px;
               cursor: pointer; }
  button.act:hover { background: rgba(255,255,255,.10); }
  button.act.primary { background: linear-gradient(180deg, var(--accent2), var(--accent));
                       border-color: #8a6410; color: #241b05; font-weight: 600; }
  button.act.primary:hover { filter: brightness(1.08); }
  button.act.danger:hover { background: rgba(207,90,62,.22); border-color: var(--bad); }
  button.act:disabled { opacity: .35; cursor: default; filter: none; }
  .hint { font-size: 10px; color: var(--dim); text-align: center; }
  .dot { width: 7px; height: 7px; border-radius: 99px; background: var(--dim); display: inline-block;
         flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot.err { background: var(--bad); }
</style>
</head>
<body>
  <header>
    <!-- The rhombus, inline rather than as an <img>: it is 300 bytes, it never 404s, and it
         inherits the accent colour so the mark and the wordmark cannot drift apart. -->
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,4 90,50 50,96 10,50" fill="#e3a417" stroke="#1a1508" stroke-width="6"/>
      <polygon points="50,4 90,50 50,50 10,50" fill="#f0bf3a"/>
      <line x1="16" y1="50" x2="84" y2="50" stroke="#1a1508" stroke-width="5"/>
    </svg>
    <h1>Meld</h1>
    <span class="dot" id="dot"></span>
    <span class="tag" id="world">—</span>
  </header>

  <nav>
    <button id="tab-status" aria-selected="true">Status</button>
    <button id="tab-meld">Meld</button>
    <button id="tab-arnis">Arnis</button>
  </nav>

  <div class="pane on" id="pane-status">
    <div class="card">
      <div class="row">
        <span class="big" id="pct">0%</span>
        <span class="dim" id="counts">idle</span>
      </div>
      <div class="bar" id="bar"><i></i></div>
      <div class="row" style="margin-top:7px">
        <span class="dim" id="elapsed">—</span>
        <span class="dim" id="eta"></span>
      </div>
    </div>
    <div class="card grid3">
      <div class="stat"><b id="cpu">—</b><span>cpu</span></div>
      <div class="stat"><b id="ram">—</b><span>ram</span></div>
      <div class="stat"><b id="free">—</b><span>free</span></div>
    </div>
    <div class="card grid3">
      <div class="stat"><b id="workers">—</b><span>workers</span></div>
      <div class="stat"><b id="failed">—</b><span>failed</span></div>
      <div class="stat"><b id="awake">—</b><span>sleep</span></div>
    </div>
    <!-- Fills what was dead space at 640px tall, and answers the question the panel is opened
         for more often than any number does: "what is it doing right now?" -->
    <div class="card activity"><div id="recent" class="recent"></div></div>
  </div>

  <div class="pane" id="pane-meld">
    <div class="consbar">
      <label><input type="checkbox" id="follow-meld" checked> follow</label>
      <span id="stat-meld"></span>
    </div>
    <div class="console" id="log-meld"></div>
  </div>

  <div class="pane" id="pane-arnis">
    <div class="consbar">
      <label><input type="checkbox" id="follow-arnis" checked> follow</label>
      <span id="stat-arnis"></span>
    </div>
    <div class="console" id="log-arnis"></div>
  </div>

  <footer>
    <button class="act danger" id="stop">Stop</button>
    <button class="act primary" id="open">Open full UI</button>
  </footer>
  <div class="hint">Closing this window leaves Meld running — quit from the tray icon.</div>

<script>
// Poll rather than stream: the server has no SSE/WebSocket path, and a 1 s poll of a
// sub-kilobyte endpoint costs less than keeping a worker thread pinned to an open connection.
const $ = id => document.getElementById(id);
let failures = 0;

// Console cursors. The server hands back `next`; sending it as `since` next time means only new
// lines cross the wire, so a window left open through a six-hour render stays cheap.
const cursors = { meld: 0, arnis: 0 };
let activeTab = 'status';

function hms(s) {
  if (s == null || s < 0) return '';
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${sec}s` : `${sec}s`;
}

function selectTab(name) {
  activeTab = name;
  for (const t of ['status', 'meld', 'arnis']) {
    $('tab-' + t).setAttribute('aria-selected', String(t === name));
    $('pane-' + t).classList.toggle('on', t === name);
  }
  if (name !== 'status') pollConsole(name);
  try { location.hash = name === 'status' ? '' : name; } catch (e) {}
}
for (const t of ['status', 'meld', 'arnis']) $('tab-' + t).onclick = () => selectTab(t);

function classify(line) {
  const l = line.toLowerCase();
  if (l.includes('error') || l.includes('panic') || l.includes('failed')) return 'err';
  if (l.includes('warn') || l.includes('retry')) return 'warn';
  return '';
}

async function pollConsole(which) {
  const box = $('log-' + which);
  try {
    const r = await fetch(`/api/console?source=${which}&since=${cursors[which]}`, { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    if (d.dropped) {
      const el = document.createElement('div');
      el.className = 'sys';
      el.textContent = '… earlier output dropped (buffer full)';
      box.appendChild(el);
    }
    cursors[which] = d.next;
    // Only ever appends. Re-rendering the whole buffer each second would fight text selection
    // and reset the scroll position mid-read.
    for (const line of d.lines || []) {
      const el = document.createElement('div');
      el.className = classify(line);
      el.textContent = line;
      box.appendChild(el);
    }
    while (box.childElementCount > 1500) box.removeChild(box.firstChild);
    if ($('follow-' + which).checked) box.scrollTop = box.scrollHeight;
    $('stat-' + which).textContent = `${box.childElementCount} lines`;
  } catch (e) { /* the status poll reports the outage */ }
}

async function tick() {
  try {
    const r = await fetch('/api/mini', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    failures = 0;

    $('dot').className = 'dot' + (d.active ? ' on' : '');
    $('world').textContent = d.world || d.project || '';
    $('pct').textContent = (d.total ? d.percent : 0) + '%';
    $('counts').textContent = d.total
      ? `${d.done}/${d.total} cells` + (d.failed ? ` · ${d.failed} failed` : '')
      : (d.phase || 'idle');
    $('bar').firstElementChild.style.width = (d.total ? d.percent : 0) + '%';
    $('bar').classList.toggle('failed', d.failed > 0);
    $('elapsed').textContent = d.total ? 'elapsed ' + hms(d.elapsed_s) : '';
    $('eta').textContent = d.eta_s != null && d.active ? 'eta ' + hms(d.eta_s) : '';

    const s = d.stats || {};
    $('cpu').textContent = s.cpu_pct != null ? s.cpu_pct + '%' : '—';
    $('ram').textContent = s.ram_pct != null ? s.ram_pct + '%' : '—';
    $('free').textContent = s.disk_free_gb != null ? Math.round(s.disk_free_gb) + 'G' : '—';
    $('workers').textContent = `${d.workers_busy}/${d.workers_max}`;
    $('failed').textContent = d.failed;
    $('awake').textContent = d.awake ? 'held' : 'free';

    const recent = $('recent');
    recent.innerHTML = '';
    for (const line of (d.log || [])) {
      const el = document.createElement('div');
      el.textContent = line;
      el.title = line;                       // the full line on hover, since it is truncated
      recent.appendChild(el);
    }
    recent.scrollTop = recent.scrollHeight;

    $('stop').disabled = !d.active;
  } catch (e) {
    // A refused fetch means Meld quit from the tray while this window stayed open. Say so
    // instead of freezing on stale numbers that look live.
    if (++failures > 2) {
      $('dot').className = 'dot err';
      $('counts').textContent = 'Meld is not running';
      $('stop').disabled = true;
    }
  }
  if (activeTab !== 'status') pollConsole(activeTab);
}

$('stop').onclick = async () => {
  $('stop').disabled = true;
  try { await fetch('/api/stop', { method: 'POST' }); } catch (e) {}
  tick();
};
// Asks the server to open it, rather than window.open(): this page is itself a chrome-less
// window, and a popup from inside one inherits that frame instead of becoming a real app window.
$('open').onclick = async () => {
  try { await fetch('/api/open-ui', { method: 'POST' }); }
  catch (e) { window.open('/', '_blank'); }
};

const wanted = (location.hash || '').replace('#', '');
if (['meld', 'arnis'].includes(wanted)) selectTab(wanted);
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
