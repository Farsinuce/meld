<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meld</title>
<link rel="icon" type="image/png" sizes="256x256" href="/icons/meld-256.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/meld-32.png">
<meta name="theme-color" content="#e3a417">
<style>
  /* Self-contained on purpose: no shared stylesheet, no web font, no framework. This window is
     opened chrome-less and has to paint instantly; index.html pulls Monocraft off a CDN, which
     would leave this panel showing a fallback face for a second - or forever, offline - so the
     pixel feel is carried by uppercase + letter-spacing on a system face instead.

     Palette and glass panels are index.html's own values, so the panel reads as part of Meld
     rather than as a debug window parked beside it. */
  :root {
    --bg:#0b0a08; --panel:#16130d; --fg:#f0e9da; --mut:#9a9079;
    --acc:#e3a417; --acc2:#f0bf3a; --ok:#86b45a; --run:#cf9f3c; --bad:#cf5a3e;
    --glass:rgba(28,26,21,.72); --hair:rgba(255,255,255,.09); --hair2:rgba(255,255,255,.05);
    --ring:0 0 0 1px rgba(0,0,0,.45); --r:12px; --rsm:8px;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(227,164,23,.07), transparent 60%),
      var(--bg);
    color:var(--fg); font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; padding:10px; gap:8px;
    -webkit-user-select:none; user-select:none; overflow:hidden;
  }

  /* ── header ─────────────────────────────────────────────────────────── */
  header { display:flex; align-items:center; gap:8px; padding:0 2px; flex:none; }
  header .mark { width:17px; height:17px; flex:none; }
  h1 { margin:0; font-size:13px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
       background:linear-gradient(180deg,var(--acc2),var(--acc));
       -webkit-background-clip:text; background-clip:text; color:transparent; }
  .world { font-size:11px; color:var(--mut); flex:1; min-width:0; text-align:right;
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ── the task card: the reason this window exists ───────────────────── */
  .task { flex:none; background:var(--glass); border:1px solid var(--hair);
          border-radius:var(--r); box-shadow:var(--ring); padding:11px 12px;
          position:relative; overflow:hidden; }
  .task::before { content:""; position:absolute; inset:0 auto 0 0; width:3px;
                  background:linear-gradient(180deg,var(--acc2),var(--acc)); opacity:.85; }
  .task .kicker { font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--mut); }
  .task .title { font-size:16px; font-weight:600; letter-spacing:.01em; margin-top:2px;
                 white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .task .detail { font-family:var(--mono); font-size:10.5px; color:var(--mut); margin-top:3px;
                  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:14px; }
  .bar { height:6px; margin-top:9px; border-radius:99px; background:rgba(0,0,0,.5);
         box-shadow:inset 0 0 0 1px var(--hair2); overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; transition:width .45s ease;
             background:linear-gradient(90deg,var(--acc),var(--acc2)); }
  .bar.warn > i { background:linear-gradient(90deg,var(--run),var(--bad)); }
  .bar.idle > i { background:var(--hair); }
  .meta { display:flex; justify-content:space-between; gap:8px; margin-top:6px;
          font-size:10.5px; color:var(--mut); font-variant-numeric:tabular-nums; }
  .meta b { color:var(--fg); font-weight:600; }

  /* ── the strip of numbers ───────────────────────────────────────────── */
  .strip { flex:none; display:grid; grid-template-columns:repeat(5,1fr); gap:1px;
           background:var(--hair2); border:1px solid var(--hair); border-radius:var(--rsm);
           overflow:hidden; }
  .strip div { background:var(--panel); padding:6px 2px; text-align:center; }
  .strip b { display:block; font-size:12px; font-variant-numeric:tabular-nums; }
  .strip span { font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--mut); }
  .strip .hot b { color:var(--acc2); }
  .strip .bad b { color:var(--bad); }

  /* ── the two logs, both live at once ────────────────────────────────── */
  .logs { flex:1; min-height:0; display:flex; flex-direction:column; gap:6px; }
  .log { display:flex; flex-direction:column; min-height:0; min-width:0;
         border:1px solid var(--hair); border-radius:var(--rsm); background:rgba(0,0,0,.42);
         box-shadow:var(--ring); flex:1 1 50%; transition:flex-grow .18s ease; }
  /* Focus mode: one log takes the room, the other keeps only its bar - so "both visible" is the
     default and "one big" is always one click away, without a tab that hides the other feed. */
  .log.min { flex:0 0 auto; }
  .log.max { flex:1 1 100%; }
  .log > .bar-head { display:flex; align-items:center; gap:6px; padding:5px 8px; cursor:pointer;
                     border-bottom:1px solid var(--hair2); flex:none; }
  .log > .bar-head:hover { background:rgba(255,255,255,.03); }
  .log .name { font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--mut); }
  .log.on .name { color:var(--acc2); }
  .log .count { font-size:9.5px; color:var(--mut); font-variant-numeric:tabular-nums; margin-left:auto; }
  .log .chev { font-size:9px; color:var(--mut); }
  .log .body { flex:1; min-height:0; min-width:0; overflow:auto; padding:6px 8px;
               font-family:var(--mono); font-size:10px; line-height:1.45; color:#c9c0aa;
               white-space:pre-wrap; word-break:break-word;
               -webkit-user-select:text; user-select:text; }
  .log.min .body { display:none; }
  .log .body .err { color:var(--bad); }
  .log .body .warn { color:var(--run); }
  .log .body .sys { color:var(--mut); font-style:italic; }
  .log .body .cell { color:var(--acc); }

  /* ── footer ─────────────────────────────────────────────────────────── */
  footer { flex:none; display:flex; gap:6px; }
  button.act { flex:1; padding:8px 4px; border-radius:var(--rsm); border:1px solid var(--hair);
               background:rgba(255,255,255,.05); color:var(--fg); font:inherit; font-size:12px;
               cursor:pointer; }
  button.act:hover { background:rgba(255,255,255,.10); }
  button.act.primary { background:linear-gradient(180deg,var(--acc2),var(--acc));
                       border-color:#8a6410; color:#241b05; font-weight:600; }
  button.act.primary:hover { filter:brightness(1.08); }
  button.act.danger:hover { background:rgba(207,90,62,.20); border-color:var(--bad); }
  button.act:disabled { opacity:.32; cursor:default; filter:none; }
  .hint { flex:none; font-size:9.5px; color:var(--mut); text-align:center; }
  .dot { width:7px; height:7px; border-radius:99px; background:var(--mut); flex:none; }
  .dot.on { background:var(--ok); box-shadow:0 0 7px var(--ok); }
  .dot.err { background:var(--bad); }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.45 } }
  .dot.on { animation:pulse 2s ease-in-out infinite; }
</style>
</head>
<body>
  <header>
    <!-- The Meld block, inline rather than an <img>: ~400 bytes, never 404s, and it scales to
         the header without a second request. Three faces of one isometric cube, lit from above -
         the same shape as the app icon, simplified to what survives at 17px. -->
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,6 94,31 50,56 6,31" fill="#f7dc95"/>
      <polygon points="6,31 50,56 50,94 6,69" fill="#e3a417"/>
      <polygon points="94,31 94,69 50,94 50,56" fill="#a9720f"/>
    </svg>
    <h1>Meld</h1>
    <span class="dot" id="dot"></span>
    <span class="world" id="world">—</span>
  </header>

  <section class="task">
    <div class="kicker">Now</div>
    <div class="title" id="taskTitle">Connecting…</div>
    <div class="detail" id="taskDetail"></div>
    <div class="bar idle" id="bar"><i></i></div>
    <div class="meta">
      <span id="counts">—</span>
      <span id="timing"></span>
    </div>
  </section>

  <section class="strip">
    <div id="s-workers"><b>—</b><span>workers</span></div>
    <div id="s-cpu"><b>—</b><span>cpu</span></div>
    <div id="s-ram"><b>—</b><span>ram</span></div>
    <div id="s-disk"><b>—</b><span>free</span></div>
    <div id="s-failed"><b>—</b><span>failed</span></div>
  </section>

  <div class="logs">
    <div class="log" id="log-meld">
      <div class="bar-head" data-for="meld">
        <span class="dot" style="background:var(--acc)"></span>
        <span class="name">Meld</span>
        <span class="count" id="count-meld">0</span>
        <span class="chev" id="chev-meld">▾</span>
      </div>
      <div class="body" id="body-meld"></div>
    </div>
    <div class="log" id="log-arnis">
      <div class="bar-head" data-for="arnis">
        <span class="dot" style="background:var(--mut)"></span>
        <span class="name">Arnis</span>
        <span class="count" id="count-arnis">0</span>
        <span class="chev" id="chev-arnis">▾</span>
      </div>
      <div class="body" id="body-arnis"></div>
    </div>
  </div>

  <footer>
    <button class="act danger" id="stop">Stop</button>
    <button class="act primary" id="open">Open Meld</button>
  </footer>
  <div class="hint">Closing this window leaves Meld running — quit from the tray icon.</div>

<script>
// Polling, not streaming: the server has no SSE/WebSocket path, and a 1 s poll of two small
// endpoints costs less than pinning a worker thread to an open connection for six hours.
const $ = id => document.getElementById(id);
const SOURCES = ['meld', 'arnis'];
const cursors = { meld: 0, arnis: 0 };   // server hands back `next`; only new lines cross the wire
const follow  = { meld: true, arnis: true };
let failures = 0;
let focused = null;                      // null = both share the space

function hms(s) {
  if (s == null || s < 0) return '';
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${sec}s` : `${sec}s`;
}

// Clicking a log's bar gives it the whole area; clicking again puts them back to an even split.
// Neither state ever hides a feed completely - the other keeps its header and its line count, so
// you can still see it is alive.
function setFocus(which) {
  focused = (focused === which) ? null : which;
  for (const s of SOURCES) {
    const el = $('log-' + s);
    el.classList.toggle('max', focused === s);
    el.classList.toggle('min', focused !== null && focused !== s);
    el.classList.toggle('on', focused === s);
    $('chev-' + s).textContent = focused === s ? '▴' : '▾';
  }
}
for (const s of SOURCES) {
  $('log-' + s).querySelector('.bar-head').onclick = () => setFocus(s);
  // Scrolling up parks the tail; scrolling back to the bottom resumes it. No checkbox needed,
  // and it does the right thing while you are reading something that scrolled past.
  $('body-' + s).addEventListener('scroll', ev => {
    const el = ev.target;
    follow[s] = el.scrollTop + el.clientHeight >= el.scrollHeight - 24;
  });
}

function classify(line) {
  const l = line.toLowerCase();
  if (l.includes('error') || l.includes('panic') || l.includes('failed')) return 'err';
  if (l.includes('warn') || l.includes('retry')) return 'warn';
  if (/^\[[-\d_,]+\]/.test(line)) return 'cell';
  return '';
}

async function pollLog(which) {
  const box = $('body-' + which);
  try {
    const r = await fetch(`/api/console?source=${which}&since=${cursors[which]}`, { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    if (d.dropped) {
      const el = document.createElement('div');
      el.className = 'sys';
      el.textContent = '… earlier output dropped (buffer full)';
      box.appendChild(el);
    }
    cursors[which] = d.next;
    // Append only. Re-rendering the buffer each second would fight text selection and throw away
    // the scroll position mid-read.
    for (const line of d.lines || []) {
      const el = document.createElement('div');
      el.className = classify(line);
      el.textContent = line;
      box.appendChild(el);
    }
    while (box.childElementCount > 1200) box.removeChild(box.firstChild);
    if (follow[which]) box.scrollTop = box.scrollHeight;
    $('count-' + which).textContent = box.childElementCount;
  } catch (e) { /* the status poll reports the outage */ }
}

function stat(id, value, hot) {
  const el = $(id);
  el.querySelector('b').textContent = value;
  el.classList.toggle('hot', !!hot && hot !== 'bad');
  el.classList.toggle('bad', hot === 'bad');
}

async function tick() {
  try {
    const r = await fetch('/api/mini', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    failures = 0;

    $('dot').className = 'dot' + (d.active ? ' on' : '');
    $('world').textContent = d.world || d.project || '';

    const t = d.task || {};
    $('taskTitle').textContent = t.title || 'Idle';
    $('taskDetail').textContent = t.detail || '';

    const pct = t.pct != null ? t.pct : (d.total ? d.percent : 0);
    const bar = $('bar');
    bar.firstElementChild.style.width = (pct || 0) + '%';
    bar.classList.toggle('warn', (d.failed || 0) > 0);
    bar.classList.toggle('idle', t.pct == null && !d.active);

    $('counts').textContent = d.total
      ? `${d.done}/${d.total} cells` + (d.failed ? ` · ${d.failed} failed` : '')
      : (d.queue && d.queue.active ? `queue ${d.queue.idx + 1}/${d.queue.total}` : '');
    $('timing').innerHTML = d.total
      ? (d.eta_s != null && d.active ? `eta <b>${hms(d.eta_s)}</b> · ` : '')
        + `ran ${hms(d.elapsed_s)}`
      : (d.awake ? 'sleep held' : '');

    const s = d.stats || {};
    stat('s-workers', `${d.workers_busy}/${d.workers_max}`, d.workers_busy > 0);
    stat('s-cpu', s.cpu_pct != null ? s.cpu_pct + '%' : '—', s.cpu_pct > 85);
    stat('s-ram', s.ram_pct != null ? s.ram_pct + '%' : '—', s.ram_pct > 85);
    stat('s-disk', s.disk_free_gb != null ? Math.round(s.disk_free_gb) + 'G' : '—',
         s.disk_free_gb != null && s.disk_free_gb < 20 ? 'bad' : false);
    stat('s-failed', d.failed ?? '—', d.failed > 0 ? 'bad' : false);

    $('stop').disabled = !d.active;
  } catch (e) {
    // A refused fetch means Meld quit from the tray while this window stayed open. Say so rather
    // than freezing on stale numbers that still look live.
    if (++failures > 2) {
      $('dot').className = 'dot err';
      $('taskTitle').textContent = 'Meld is not running';
      $('taskDetail').textContent = 'start it from the tray icon';
      $('stop').disabled = true;
    }
  }
  for (const s of SOURCES) pollLog(s);
}

$('stop').onclick = async () => {
  $('stop').disabled = true;
  try { await fetch('/api/stop', { method: 'POST' }); } catch (e) {}
  tick();
};
// Asks the server to open it: this page is itself a chrome-less window, and window.open() from
// inside one produces a popup wearing the same frame instead of a real app window.
$('open').onclick = async () => {
  try { await fetch('/api/open-ui', { method: 'POST' }); }
  catch (e) { window.open('/', '_blank'); }
};

const wanted = (location.hash || '').replace('#', '');
if (SOURCES.includes(wanted)) setFocus(wanted);
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
